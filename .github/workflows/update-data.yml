name: Update holiday data

on:
  schedule:
    # 日本时间 12:17 / 中国时间 11:17。避开整点，GitHub 可能有延迟。
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build data
        run: python -m scripts.build --output docs/v1

      - name: Summarize
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          manifest = json.loads(Path("docs/v1/manifest.json").read_text())
          print("### Holiday data")
          print(f"- dataVersion: `{manifest['dataVersion']}`")
          print(f"- JP years: {manifest['years']['jp']}")
          print(f"- CN years: {manifest['years']['cn']}")
          print(f"- generatedAt: {manifest['generatedAt']}")
          PY

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- docs/v1)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v1
          VERSION=$(python -c "import json;print(json.load(open('docs/v1/manifest.json'))['dataVersion'])")
          git commit -m "data: update ${VERSION}"
          git push
